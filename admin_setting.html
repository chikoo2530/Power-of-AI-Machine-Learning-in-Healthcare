{% extends "admin_layout.html" %}

{% block header %}
⚙ Admin Settings
{% endblock %}

{% block content %}

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
/* ── PAGE WRAPPER (Centering) ── */
.page-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh; /* Adjust based on admin layout */
    width: 100%;
}

/* ── GLASS CARD ── */
.container {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    padding: 44px 36px 36px;
    border-radius: 24px;
    width: 400px;
    max-width: 95vw;
    text-align: center;
    box-shadow: 
        0 8px 32px rgba(92, 184, 165, 0.10),
        0 2px 8px rgba(0,0,0,0.04),
        inset 0 1px 0 rgba(255,255,255,0.6);
    animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes cardEntry {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

/* ── BRANDING ── */
.brand-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, #5CB8A5, #7DD3C0);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    box-shadow: 0 4px 16px rgba(92, 184, 165, 0.3);
    animation: iconPulse 3s ease-in-out infinite;
}

@keyframes iconPulse {
    0%, 100% { box-shadow: 0 4px 16px rgba(92, 184, 165, 0.3); }
    50% { box-shadow: 0 4px 28px rgba(92, 184, 165, 0.5); }
}

.brand-name {
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: #5CB8A5;
    margin-bottom: 6px;
}

h2 {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: #1a3a35;
    margin-bottom: 4px;
}

.subtitle {
    font-size: 13.5px;
    color: #7a9e98;
    margin-bottom: 28px;
    font-weight: 400;
}

/* ── FORM ── */
.form-group {
    position: relative;
    margin-bottom: 20px;
    text-align: left;
}

.form-group label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: #4a7c74;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
}

.input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.input-wrapper .input-icon {
    position: absolute;
    left: 14px;
    color: #a3c4be;
    pointer-events: none;
    transition: color 0.3s;
    width: 18px;
    height: 18px;
}

.input-wrapper input {
    width: 100%;
    padding: 12px 14px 12px 42px;
    border-radius: 12px;
    border: 1.5px solid #d4e8e3;
    background: rgba(255, 255, 255, 0.7);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #1a3a35;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
}

.input-wrapper input:hover {
    border-color: #a3d4c8;
    background: rgba(255, 255, 255, 0.9);
}

.input-wrapper input:focus {
    border-color: #5CB8A5;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 0 4px rgba(92, 184, 165, 0.1);
}

.input-wrapper:focus-within .input-icon {
    color: #5CB8A5;
}

/* ── PASSWORD TOGGLE ── */
.pw-toggle {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    cursor: pointer;
    color: #a3c4be;
    padding: 4px;
    transition: color 0.3s;
    display: flex;
    align-items: center;
}

.pw-toggle:hover { color: #5CB8A5; }
.pw-toggle svg { width: 18px; height: 18px; }

/* ── BUTTONS ── */
.btn-save {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #5CB8A5, #7DD3C0);
    border: none;
    color: white;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    margin-top: 6px;
    box-shadow: 0 4px 16px rgba(92, 184, 165, 0.25);
    position: relative;
    overflow: hidden;
}

.btn-save::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: left 0.5s;
}

.btn-save:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(92, 184, 165, 0.35);
    background: linear-gradient(135deg, #4aA895, #6bc7b0);
}

.btn-save:hover::before { left: 100%; }

/* ── BACKGROUND ── */
#bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* Behind sidebar and content */
}

.float-particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
    opacity: 0;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    10% { opacity: 0.6; transform: translateY(-10vh) scale(1); }
    90% { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-100vh) scale(0.5); }
}

.toast {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 200;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(92, 184, 165, 0.2);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    transform: translateX(120%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    font-size: 13px;
    color: #1a3a35;
}
.toast.show { transform: translateX(0); }
.toast .toast-icon { width: 20px; height: 20px; color: #5CB8A5; flex-shrink: 0; }
</style>

<!-- 3D Background Canvas -->
<canvas id="bg-canvas"></canvas>

<!-- Floating CSS Particles -->
<div id="css-particles"></div>

<!-- Toast -->
<div class="toast" id="toast">
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></svg>
    <span id="toast-msg">Settings Loaded</span>
</div>

<!-- Main Page Wrapper -->
<div class="page-wrapper">

<div class="container">

    <!-- Branding -->
    <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0 1.51-1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>
    <div class="brand-name">Admin Panel</div>
    <h2>Settings</h2>
    <p class="subtitle">Update your admin password</p>

    <!-- Form -->
    <form method="POST">

        <div class="form-group">
            <label for="password">New Password</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" name="password" id="password" placeholder="Enter new password" required>
                
                <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">
                    <svg id="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    <svg id="eyeOn" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-save">Update Password</button>

    </form>
</div>

</div>

<script>
// ── PASSWORD TOGGLE ──
const pwToggle = document.getElementById('pwToggle');
const pwInput = document.getElementById('password');
const eyeOff = document.getElementById('eyeOff');
const eyeOn = document.getElementById('eyeOn');

if(pwToggle) {
    pwToggle.addEventListener('click', () => {
        const isPassword = pwInput.type === 'password';
        pwInput.type = isPassword ? 'text' : 'password';
        eyeOff.style.display = isPassword ? 'none' : 'block';
        eyeOn.style.display = isPassword ? 'block' : 'none';
    });
}

// ── TOAST ON LOAD ──
window.addEventListener('load', () => {
    setTimeout(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }, 1000);
});

// ── CSS FLOATING PARTICLES ──
(function createCSSParticles() {
    const container = document.getElementById('css-particles');
    const colors = [
        'rgba(92, 184, 165, 0.4)',
        'rgba(125, 211, 192, 0.35)',
        'rgba(180, 220, 210, 0.3)',
        'rgba(168, 216, 234, 0.3)'
    ];

    for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.classList.add('float-particle');
        const size = Math.random() * 6 + 3;
        const color = colors[Math.floor(Math.random() * colors.length)];
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.background = color;
        p.style.left = Math.random() * 100 + 'vw';
        p.style.bottom = '-10px';
        p.style.animationDuration = (Math.random() * 12 + 10) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        container.appendChild(p);
    }
})();

// ── THREE.JS 3D BACKGROUND ──
(function initThreeJS() {
    const canvas = document.getElementById('bg-canvas');
    if(!canvas) return;
    const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;

    const palette = [
        new THREE.Color(0x5CB8A5),
        new THREE.Color(0x7DD3C0),
        new THREE.Color(0xB4DCD2),
        new THREE.Color(0xA8D8EA),
        new THREE.Color(0xD4E8E3)
    ];

    const nodeCount = 40;
    const nodes = [];
    const nodeGroup = new THREE.Group();
    const sphereGeo = new THREE.SphereGeometry(0.25, 16, 16);

    for (let i = 0; i < nodeCount; i++) {
        const mat = new THREE.MeshBasicMaterial({
            color: palette[Math.floor(Math.random() * palette.length)],
            transparent: true,
            opacity: 0.6
        });
        const mesh = new THREE.Mesh(sphereGeo, mat);
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 8 + Math.random() * 18;
        mesh.position.set(
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi)
        );
        mesh.userData = {
            originalPos: mesh.position.clone(),
            speed: 0.3 + Math.random() * 0.5,
            offset: Math.random() * Math.PI * 2,
            amplitude: 0.5 + Math.random() * 1.5
        };
        nodeGroup.add(mesh);
        nodes.push(mesh);
    }
    scene.add(nodeGroup);

    const lineMaterial = new THREE.LineBasicMaterial({
        color: 0x5CB8A5,
        transparent: true,
        opacity: 0.08
    });
    const lineGeometry = new THREE.BufferGeometry();
    const linePositions = [];

    function updateLines() {
        linePositions.length = 0;
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const dist = nodes[i].position.distanceTo(nodes[j].position);
                if (dist < 8) {
                    linePositions.push(
                        nodes[i].position.x, nodes[i].position.y, nodes[i].position.z,
                        nodes[j].position.x, nodes[j].position.y, nodes[j].position.z
                    );
                }
            }
        }
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
    }
    const linesMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(linesMesh);

    function createHelix(offset, color, radius) {
        const points = [];
        const helixRadius = radius || 3.5;
        const helixHeight = 45;
        const turns = 3.5;
        for (let i = 0; i < 220; i++) {
            const t = i / 220;
            const angle = t * Math.PI * 2 * turns + offset;
            points.push(new THREE.Vector3(
                Math.cos(angle) * helixRadius,
                (t - 0.5) * helixHeight,
                Math.sin(angle) * helixRadius
            ));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.15 });
        return new THREE.Line(geo, mat);
    }

    const helix1 = createHelix(0, 0x5CB8A5, 4);
    const helix2 = createHelix(Math.PI, 0xB4DCD2, 4);
    helix1.rotation.z = 0.2;
    helix2.rotation.z = 0.2;
    helix1.position.x = -15;
    helix2.position.x = -15;
    scene.add(helix1);
    scene.add(helix2);

    const ringGroup = new THREE.Group();
    const ringGeo = new THREE.TorusGeometry(0.3, 0.05, 8, 24);
    for (let i = 0; i < 10; i++) {
        const mat = new THREE.MeshBasicMaterial({
            color: palette[Math.floor(Math.random() * palette.length)],
            transparent: true,
            opacity: 0.3
        });
        const ring = new THREE.Mesh(ringGeo, mat);
        ring.position.set(
            (Math.random() - 0.5) * 50,
            (Math.random() - 0.5) * 30,
            (Math.random() - 0.5) * 20 - 5
        );
        ring.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        ring.scale.setScalar(0.5 + Math.random());
        ring.userData = {
            rotSpeed: { x: (Math.random() - 0.5) * 0.01, y: (Math.random() - 0.5) * 0.01 },
            floatSpeed: 0.2 + Math.random() * 0.3,
            floatOffset: Math.random() * Math.PI * 2
        };
        ringGroup.add(ring);
    }
    scene.add(ringGroup);

    let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
    document.addEventListener('mousemove', (e) => {
        targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetMouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.005;

        mouseX += (targetMouseX - mouseX) * 0.03;
        mouseY += (targetMouseY - mouseY) * 0.03;

        nodeGroup.rotation.y = mouseX * 0.1;
        nodeGroup.rotation.x = mouseY * 0.05;

        nodes.forEach(node => {
            const d = node.userData;
            node.position.x = d.originalPos.x + Math.sin(time * d.speed + d.offset) * d.amplitude;
            node.position.y = d.originalPos.y + Math.cos(time * d.speed * 0.7 + d.offset) * d.amplitude;
            node.position.z = d.originalPos.z + Math.sin(time * d.speed * 0.5 + d.offset + 1) * d.amplitude * 0.5;
        });

        updateLines();

        helix1.rotation.y = time * 0.2 + mouseX * 0.1;
        helix2.rotation.y = time * 0.2 + mouseX * 0.1;

        ringGroup.children.forEach(ring => {
            ring.rotation.x += ring.userData.rotSpeed.x;
            ring.rotation.y += ring.userData.rotSpeed.y;
            ring.position.y += Math.sin(time * ring.userData.floatSpeed + ring.userData.floatOffset) * 0.003;
        });

        camera.position.x += (mouseX * 1.5 - camera.position.x) * 0.02;
        camera.position.y += (-mouseY * 1.5 - camera.position.y) * 0.02;
        camera.lookAt(scene.position);

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
})();
</script>

{% endblock %}
