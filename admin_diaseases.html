<!DOCTYPE html>
<html>
<head>
<title>Manage Diseases — MedAI Predict</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: #e8f4f0;
    color: #1a3a35;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ── 3D BACKGROUND LAYERS ── */
#bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}

.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: 
        radial-gradient(ellipse at 20% 50%, rgba(125, 211, 192, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(168, 216, 234, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(232, 165, 152, 0.08) 0%, transparent 50%);
    pointer-events: none;
}

/* ── PAGE WRAPPER ── */
.page-wrapper {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: flex-start; /* Align top for scrolling lists */
    min-height: 100vh;
    padding: 40px 20px;
    overflow-y: auto;
}

/* ── GLASS CARD ── */
.container {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 24px;
    padding: 40px;
    width: 800px;
    max-width: 95vw;
    box-shadow: 
        0 8px 32px rgba(92, 184, 165, 0.15),
        0 2px 8px rgba(0,0,0,0.04),
        inset 0 1px 0 rgba(255,255,255,0.6);
    animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ── HEADER ── */
.page-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
}

.header-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, #5CB8A5, #7DD3C0);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(92, 184, 165, 0.25);
}

.header-icon svg { color: white; width: 24px; height: 24px; }

h2 {
    font-family: 'Outfit', sans-serif;
    font-size: 24px;
    font-weight: 600;
    color: #1a3a35;
}

/* ── ADD DISEASE FORM ── */
.form-card {
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.5);
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 30px;
    display: flex;
    gap: 15px;
    align-items: flex-end;
    flex-wrap: wrap;
}

.input-group {
    flex: 1;
    min-width: 200px;
}

.input-group label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: #4a7c74;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
}

.input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.input-wrapper .input-icon {
    position: absolute;
    left: 12px;
    color: #a3c4be;
    pointer-events: none;
    width: 18px;
    height: 18px;
}

.form-card input {
    width: 100%;
    padding: 10px 12px 10px 38px;
    border-radius: 10px;
    border: 1.5px solid #d4e8e3;
    background: rgba(255, 255, 255, 0.7);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: 0.3s;
}

.form-card input:focus {
    border-color: #5CB8A5;
    background: white;
    box-shadow: 0 0 0 3px rgba(92, 184, 165, 0.1);
}

.form-card input:focus ~ .input-icon {
    color: #5CB8A5;
}

/* Add Button */
.btn-add {
    padding: 10px 24px;
    background: linear-gradient(135deg, #5CB8A5, #7DD3C0);
    border: none;
    color: white;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    height: 42px; /* Match input height */
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 12px rgba(92, 184, 165, 0.2);
}

.btn-add:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(92, 184, 165, 0.3);
}

/* ── DISEASE TABLE ── */
.table-wrapper {
    background: rgba(255,255,255,0.5);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.5);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: rgba(92, 184, 165, 0.1);
    color: #1a3a35;
    text-align: left;
    padding: 16px 20px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

td {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    color: #4a7c74;
    font-size: 14px;
}

tr:last-child td { border-bottom: none; }

tr:hover td {
    background: rgba(92, 184, 165, 0.03);
}

/* Delete Action */
.btn-delete {
    color: #ef4444;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: 0.2s;
}

.btn-delete:hover {
    background: rgba(239, 68, 68, 0.1);
    color: #dc2626;
}

/* ── BACK BUTTON ── */
.btn-back {
    display: flex;
    justify-content: center;
    margin-top: 30px;
    padding: 12px;
    background: rgba(108, 130, 125, 0.08);
    border: 1.5px solid rgba(108, 130, 125, 0.12);
    color: #5a7d76;
    border-radius: 12px;
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    transition: 0.3s;
    width: 100%;
    box-sizing: border-box;
}

.btn-back:hover {
    background: rgba(108, 130, 125, 0.14);
    color: #3d5c56;
    transform: translateY(-1px);
}

/* ── PARTICLES & BACKGROUND ── */
.float-particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    10% { opacity: 0.6; transform: translateY(-10vh) scale(1); }
    90% { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-100vh) scale(0.5); }
}
</style>

</head>

<body>

<!-- 3D Background Canvas -->
<canvas id="bg-canvas"></canvas>

<!-- Gradient Overlay -->
<div class="overlay"></div>

<!-- Floating CSS Particles -->
<div id="css-particles"></div>

<!-- Main Page Wrapper -->
<div class="page-wrapper">

<div class="container">

    <!-- Header -->
    <div class="page-header">
        <div class="header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 7H7a5 5 0 0 0-5 5m10 0a5 5 0 0 0-5 5m-5 5v10m10-10v10"/></svg>
        </div>
        <h2>Manage Diseases</h2>
    </div>

    <!-- Add Disease Form -->
    <form method="post" action="/add_disease" class="form-card">
        <div class="input-group">
            <label>Disease Name</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l8-3 8 3v7z"/><path d="M2.05 10.76a10 10 0 0 1 14.9-6.36"/></svg>
                <input type="text" name="name" placeholder="e.g., Diabetes" required>
            </div>
        </div>

        <div class="input-group">
            <label>Description</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></svg>
                <input type="text" name="description" placeholder="Brief description" required>
            </div>
        </div>

        <button type="submit" class="btn-add">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Disease
        </button>
    </form>

    <!-- Disease List Table -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Disease Name</th>
                    <th>Description</th>
                    <th style="width: 100px;">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for d in diseases %}
                <tr>
                    <td style="font-weight:600; color:#1a3a35;">{{d[0]}}</td>
                    <td>{{d[1]}}</td>
                    <td>
                        <a href="/delete_disease/{{d[0]}}" class="btn-delete">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 12 18 6 18 6 12 18 3 18 3 18 12 18 6 6 18 6 6 12 18 3 18"/></svg>
                            Delete
                        </a>
                    </td>
                </tr>
                {% endfor %}
                
                {% if not diseases %}
                <tr>
                    <td colspan="3" style="text-align:center; padding: 20px; color: #7a9e98;">
                        No diseases found in database.
                    </td>
                </tr>
                {% endif %}
            </tbody>
        </table>
    </div>

    <!-- Back Button -->
    <a href="/admin_dashboard" class="btn-back">
        ⬅ Back to Dashboard
    </a>

</div>

</div>

<!-- THREE.JS & JS LOGIC -->
<script>
// ── CSS FLOATING PARTICLES ──
(function createCSSParticles() {
    const container = document.body;
    const colors = [
        'rgba(92, 184, 165, 0.4)',
        'rgba(125, 211, 192, 0.35)',
        'rgba(180, 220, 210, 0.3)',
        'rgba(168, 216, 234, 0.3)'
    ];

    for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.classList.add('float-particle');
        const size = Math.random() * 6 + 3;
        const color = colors[Math.floor(Math.random() * colors.length)];
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.background = color;
        p.style.left = Math.random() * 100 + 'vw';
        p.style.bottom = '-10px';
        p.style.animationDuration = (Math.random() * 12 + 10) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        container.appendChild(p);
    }
})();

// ── THREE.JS 3D BACKGROUND ──
(function initThreeJS() {
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;

    const palette = [
        new THREE.Color(0x5CB8A5),
        new THREE.Color(0x7DD3C0),
        new THREE.Color(0xB4DCD2),
        new THREE.Color(0xA8D8EA),
        new THREE.Color(0xD4E8E3)
    ];

    // MOLECULAR NODES
    const nodeCount = 40;
    const nodes = [];
    const nodeGroup = new THREE.Group();
    const sphereGeo = new THREE.SphereGeometry(0.25, 16, 16);

    for (let i = 0; i < nodeCount; i++) {
        const mat = new THREE.MeshBasicMaterial({
            color: palette[Math.floor(Math.random() * palette.length)],
            transparent: true,
            opacity: 0.6
        });
        const mesh = new THREE.Mesh(sphereGeo, mat);
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 8 + Math.random() * 18;
        mesh.position.set(
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi)
        );
        mesh.userData = {
            originalPos: mesh.position.clone(),
            speed: 0.3 + Math.random() * 0.5,
            offset: Math.random() * Math.PI * 2,
            amplitude: 0.5 + Math.random() * 1.5
        };
        nodeGroup.add(mesh);
        nodes.push(mesh);
    }
    scene.add(nodeGroup);

    const lineMaterial = new THREE.LineBasicMaterial({
        color: 0x5CB8A5,
        transparent: true,
        opacity: 0.08
    });
    const lineGeometry = new THREE.BufferGeometry();
    const linePositions = [];

    function updateLines() {
        linePositions.length = 0;
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const dist = nodes[i].position.distanceTo(nodes[j].position);
                if (dist < 8) {
                    linePositions.push(
                        nodes[i].position.x, nodes[i].position.y, nodes[i].position.z,
                        nodes[j].position.x, nodes[j].position.y, nodes[j].position.z
                    );
                }
            }
        }
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
    }
    const linesMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(linesMesh);

    function createHelix(offset, color, radius) {
        const points = [];
        const helixRadius = radius || 3.5;
        const helixHeight = 45;
        const turns = 3.5;
        for (let i = 0; i < 220; i++) {
            const t = i / 220;
            const angle = t * Math.PI * 2 * turns + offset;
            points.push(new THREE.Vector3(
                Math.cos(angle) * helixRadius,
                (t - 0.5) * helixHeight,
                Math.sin(angle) * helixRadius
            ));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.15 });
        return new THREE.Line(geo, mat);
    }

    const helix1 = createHelix(0, 0x5CB8A5, 4);
    const helix2 = createHelix(Math.PI, 0xB4DCD2, 4);
    helix1.rotation.z = 0.2;
    helix2.rotation.z = 0.2;
    helix1.position.x = -15;
    helix2.position.x = -15;
    scene.add(helix1);
    scene.add(helix2);

    const ringGroup = new THREE.Group();
    const ringGeo = new THREE.TorusGeometry(0.3, 0.05, 8, 24);
    for (let i = 0; i < 10; i++) {
        const mat = new THREE.MeshBasicMaterial({
            color: palette[Math.floor(Math.random() * palette.length)],
            transparent: true,
            opacity: 0.3
        });
        const ring = new THREE.Mesh(ringGeo, mat);
        ring.position.set(
            (Math.random() - 0.5) * 50,
            (Math.random() - 0.5) * 30,
            (Math.random() - 0.5) * 20 - 5
        );
        ring.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        ring.scale.setScalar(0.5 + Math.random());
        ring.userData = {
            rotSpeed: { x: (Math.random() - 0.5) * 0.01, y: (Math.random() - 0.5) * 0.01 },
            floatSpeed: 0.2 + Math.random() * 0.3,
            floatOffset: Math.random() * Math.PI * 2
        };
        ringGroup.add(ring);
    }
    scene.add(ringGroup);

    let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
    document.addEventListener('mousemove', (e) => {
        targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetMouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.005;

        mouseX += (targetMouseX - mouseX) * 0.03;
        mouseY += (targetMouseY - mouseY) * 0.03;

        nodeGroup.rotation.y = mouseX * 0.1;
        nodeGroup.rotation.x = mouseY * 0.05;

        nodes.forEach(node => {
            const d = node.userData;
            node.position.x = d.originalPos.x + Math.sin(time * d.speed + d.offset) * d.amplitude;
            node.position.y = d.originalPos.y + Math.cos(time * d.speed * 0.7 + d.offset) * d.amplitude;
            node.position.z = d.originalPos.z + Math.sin(time * d.speed * 0.5 + d.offset + 1) * d.amplitude * 0.5;
        });

        updateLines();

        helix1.rotation.y = time * 0.2 + mouseX * 0.1;
        helix2.rotation.y = time * 0.2 + mouseX * 0.1;

        ringGroup.children.forEach(ring => {
            ring.rotation.x += ring.userData.rotSpeed.x;
            ring.rotation.y += ring.userData.rotSpeed.y;
            ring.position.y += Math.sin(time * ring.userData.floatSpeed + ring.userData.floatOffset) * 0.003;
        });

        camera.position.x += (mouseX * 1.5 - camera.position.x) * 0.02;
        camera.position.y += (-mouseY * 1.5 - camera.position.y) * 0.02;
        camera.lookAt(scene.position);

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    lucide.createIcons();
})();
</script>

</body>
</html>
