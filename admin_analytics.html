{% extends "admin_layout.html" %}

{% block header %}📊 System Analytics{% endblock %}

{% block content %}

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
/* ─── GLASS CARD STYLING (Matching Users Page) ─── */
.page-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px; /* Spacing between charts */
    padding-bottom: 40px;
}

.glass-card {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 24px;
    padding: 30px;
    width: 800px;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 8px 32px rgba(92, 184, 165, 0.15); /* Matching shadow */
    animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0; /* Starts hidden for animation */
    transform: translateY(20px); /* Starts lower for animation */
}

/* Staggered animation delays for visual flow */
.glass-card:nth-child(1) { animation-delay: 0.1s; }
.glass-card:nth-child(2) { animation-delay: 0.2s; }
.glass-card:nth-child(3) { animation-delay: 0.3s; }
.glass-card:nth-child(4) { animation-delay: 0.4s; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.glass-card h3 {
    margin-top: 0;
    margin-bottom: 15px;
    color: #1a3a35;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
}

.chart-container {
    height: 300px;
    position: relative;
    width: 100%;
}

/* ─── BACKGROUND PARTICLES ANIMATION ─── */
@keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    10% { opacity: 0.6; transform: translateY(-10vh) scale(1); }
    90% { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-100vh) scale(0.5); }
}
</style>

<!-- 3D Background Canvases (Must be outside the wrapper) -->
<canvas id="bg-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1;"></canvas>
<canvas id="css-particles" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1;"></canvas>

<div class="page-wrapper">

    <!-- BAR -->
    <div class="glass-card">
        <h3>Bar Graph (Predictions)</h3>
        <div class="chart-container">
            <canvas id="barChart"></canvas>
        </div>
    </div>

    <!-- PIE -->
    <div class="glass-card">
        <h3>Pie Chart (Detected vs Not)</h3>
        <div class="chart-container">
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <!-- LINE -->
    <div class="glass-card">
        <h3>Line Graph (Trend)</h3>
        <div class="chart-container">
            <canvas id="lineChart"></canvas>
        </div>
    </div>

    <!-- HEAT -->
    <div class="glass-card">
        <h3>Heatmap (Disease Intensity)</h3>
        <div class="chart-container">
            <canvas id="heatChart"></canvas>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let barChart, pieChart, lineChart, heatChart;

// Common styling
Chart.defaults.font.family = "'Outfit', sans-serif";
Chart.defaults.color = '#4a7c74';

// 🔵 Create Loading Indicator
const loader = document.createElement("div");
loader.innerHTML = "Loading analytics...";
loader.style.position = "fixed";
loader.style.top = "20px";
loader.style.right = "20px";
loader.style.padding = "10px 16px";
loader.style.background = "rgba(0,0,0,0.6)";
loader.style.color = "white";
loader.style.borderRadius = "10px";
loader.style.fontSize = "14px";
loader.style.zIndex = "9999";
loader.style.display = "none";
document.body.appendChild(loader);

function showLoader() {
    loader.style.display = "block";
}

function hideLoader() {
    loader.style.display = "none";
}

async function loadCharts() {
    try {
        showLoader();

        const res = await fetch('/api/admin_analytics');

        if (!res.ok) {
            throw new Error("API error");
        }

        const data = await res.json();

        const { labels, values, pie_labels, pie_values, trend_labels, trend_values } = data;

        // Destroy old charts
        if (barChart) barChart.destroy();
        if (pieChart) pieChart.destroy();
        if (lineChart) lineChart.destroy();
        if (heatChart) heatChart.destroy();

        // =========================
        // BAR
        // =========================
        barChart = new Chart(document.getElementById("barChart"), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Predictions',
                    data: values,
                    backgroundColor: '#5CB8A5',
                    borderRadius: 6
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } }
            }
        });

        // =========================
        // PIE
        // =========================
        pieChart = new Chart(document.getElementById("pieChart"), {
            type: 'pie',
            data: {
                labels: pie_labels,
                datasets: [{
                    data: pie_values,
                    backgroundColor: [
                        '#4CAF50',   // green
                        '#FF5252',   // red
                        '#FFC107',   // yellow
                        '#2196F3',   // blue
                        '#9C27B0',   // purple
                        '#FF9800',   // orange
                        '#00BCD4',   // cyan
                        '#8BC34A'    // light green
                    ],
                    borderColor: '#ffffff',
                    borderWidth: 2
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } }
            }
        });

        // =========================
        // LINE
        // =========================
        lineChart = new Chart(document.getElementById("lineChart"), {
            type: 'line',
            data: {
                labels: trend_labels,
                datasets: [{
                    label: 'Trend',
                    data: trend_values,
                    borderColor: '#5CB8A5',
                    backgroundColor: 'rgba(92, 184, 165, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#ffffff',
                    pointBorderColor: '#5CB8A5',
                    pointRadius: 4
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false } },
                    y: { grid: { color: 'rgba(0,0,0,0.05)' } }
                }
            }
        });

        // =========================
        // HEATMAP
        // =========================
        heatChart = new Chart(document.getElementById("heatChart"), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Intensity',
                    data: values,
                    backgroundColor: values.map(v => {
                        if (v >= 15) return 'rgba(255, 0, 0, 0.8)';
                        if (v >= 10) return 'rgba(255, 99, 132, 0.8)';
                        if (v >= 5) return 'rgba(255, 165, 0, 0.8)';
                        if (v >= 2) return 'rgba(255, 206, 86, 0.8)';
                        return 'rgba(92, 184, 165, 0.8)';
                    }),
                    borderRadius: 8
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });

        hideLoader();

    } catch (error) {
        console.error("Error loading charts:", error);
        loader.innerHTML = "Loading analytics...";
        loader.style.background = "rgba(0,0,0,0.6)";
        loader.style.display = "block";
    }
}

// 🚀 Initial Load
loadCharts();


// ────────────────────────────────────────
// 2. THREE.JS 3D BACKGROUND (From admin_users.html)
// ────────────────────────────────────────
(function initThreeJS() {
    const canvas = document.getElementById('bg-canvas');
    if(!canvas) return;
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;

    const palette = [
        new THREE.Color(0x5CB8A5), new THREE.Color(0x7DD3C0),
        new THREE.Color(0xB4DCD2), new THREE.Color(0xA8D8EA)
    ];

    const nodeCount = 40; const nodes = []; const nodeGroup = new THREE.Group();
    const sphereGeo = new THREE.SphereGeometry(0.25, 16, 16);
    for (let i = 0; i < nodeCount; i++) {
        const mat = new THREE.MeshBasicMaterial({ color: palette[Math.floor(Math.random() * palette.length)], transparent: true, opacity: 0.6 });
        const mesh = new THREE.Mesh(sphereGeo, mat);
        const theta = Math.random() * Math.PI * 2; const phi = Math.acos(2 * Math.random() - 1); const r = 8 + Math.random() * 18;
        mesh.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
        mesh.userData = { originalPos: mesh.position.clone(), speed: 0.3 + Math.random() * 0.5, offset: Math.random() * Math.PI * 2, amplitude: 0.5 + Math.random() * 1.5 };
        nodeGroup.add(mesh); nodes.push(mesh);
    }
    scene.add(nodeGroup);

    const lineMaterial = new THREE.LineBasicMaterial({ color: 0x5CB8A5, transparent: true, opacity: 0.08 });
    const lineGeometry = new THREE.BufferGeometry();
    function updateLines() {
        const linePositions = [];
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const dist = nodes[i].position.distanceTo(nodes[j].position);
                if (dist < 8) linePositions.push(nodes[i].position.x, nodes[i].position.y, nodes[i].position.z, nodes[j].position.x, nodes[j].position.y, nodes[j].position.z);
            }
        }
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
    }
    scene.add(new THREE.LineSegments(lineGeometry, lineMaterial));

    function createHelix(offset, color, radius) {
        const points = [];
        for (let i = 0; i < 220; i++) {
            const t = i / 220;
            const angle = t * Math.PI * 2 * 3.5 + offset;
            points.push(new THREE.Vector3(Math.cos(angle) * radius, (t - 0.5) * 45, Math.sin(angle) * radius));
        }
        return new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.15 }));
    }

    const helix1 = createHelix(0, 0x5CB8A5, 4);
    const helix2 = createHelix(Math.PI, 0xB4DCD2, 4);
    helix1.rotation.z = 0.2; helix2.rotation.z = 0.2;
    helix1.position.x = -15; helix2.position.x = -15;
    scene.add(helix1); scene.add(helix2);

    const ringGroup = new THREE.Group();
    const ringGeo = new THREE.TorusGeometry(0.3, 0.05, 8, 24);
    for (let i = 0; i < 10; i++) {
        const mat = new THREE.MeshBasicMaterial({ color: palette[Math.floor(Math.random() * palette.length)], transparent: true, opacity: 0.3 });
        const ring = new THREE.Mesh(ringGeo, mat);
        ring.position.set((Math.random() - 0.5) * 50, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 20 - 5);
        ring.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        ring.scale.setScalar(0.5 + Math.random());
        ring.userData = { rotSpeed: { x: (Math.random() - 0.5) * 0.01, y: (Math.random() - 0.5) * 0.01 }, floatSpeed: 0.2 + Math.random() * 0.3, floatOffset: Math.random() * Math.PI * 2 };
        ringGroup.add(ring);
    }
    scene.add(ringGroup);

    let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
    document.addEventListener('mousemove', (e) => {
        targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetMouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.005;
        mouseX += (targetMouseX - mouseX) * 0.03;
        mouseY += (targetMouseY - mouseY) * 0.03;

        nodeGroup.rotation.y = mouseX * 0.1; nodeGroup.rotation.x = mouseY * 0.05;
        nodes.forEach(node => {
            const d = node.userData;
            node.position.x = d.originalPos.x + Math.sin(time * d.speed + d.offset) * d.amplitude;
            node.position.y = d.originalPos.y + Math.cos(time * d.speed * 0.7 + d.offset) * d.amplitude;
            node.position.z = d.originalPos.z + Math.sin(time * d.speed * 0.5 + d.offset + 1) * d.amplitude * 0.5;
        });
        updateLines();
        helix1.rotation.y = time * 0.2 + mouseX * 0.1;
        helix2.rotation.y = time * 0.2 + mouseX * 0.1;
        ringGroup.children.forEach(ring => {
            ring.rotation.x += ring.userData.rotSpeed.x;
            ring.rotation.y += ring.userData.rotSpeed.y;
            ring.position.y += Math.sin(time * ring.userData.floatSpeed + ring.userData.floatOffset) * 0.003;
        });
        camera.position.x += (mouseX * 1.5 - camera.position.x) * 0.02;
        camera.position.y += (-mouseY * 1.5 - camera.position.y) * 0.02;
        camera.lookAt(scene.position);
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
})();

// ────────────────────────────────────────
// 3. CSS PARTICLES (From admin_users.html)
// ────────────────────────────────────────
(function createCSSParticles() {
    const container = document.body;
    const colors = ['rgba(92, 184, 165, 0.4)', 'rgba(125, 211, 192, 0.35)', 'rgba(180, 220, 210, 0.3)', 'rgba(168, 216, 234, 0.3)'];
    for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.style.cssText = `position:fixed; border-radius:50%; pointer-events:none; z-index:-1; opacity:0; animation:floatUp linear infinite; width:${Math.random()*6+3}px; height:${Math.random()*6+3}px; background:${colors[Math.floor(Math.random()*colors.length)]}; left:${Math.random()*100}vw; bottom:-10px; animation-duration:${Math.random()*12+10}s; animation-delay:${Math.random()*10}s;`;
        container.appendChild(p);
    }
})();
</script>
{% endblock %}
