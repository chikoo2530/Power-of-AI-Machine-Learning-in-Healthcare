{% extends "user_layout.html" %}

{% block title %}
User Profile — MedAI Predict
{% endblock %}

{% block header %}
User Profile
{% endblock %}

{% block content %}

<div class="page-wrapper">

<div class="container">

    <!-- Branding -->
    <div class="brand-icon">
        <i data-lucide="user"></i>
    </div>

    <div class="brand-name">MedAI Predict</div>
    <h2>User Profile</h2>
    <p class="subtitle">Manage your personal information</p>

    <!-- FORM -->
    <form action="/update_profile" method="POST">

        <div class="form-group">
            <label>Name</label>
            <div class="input-wrapper">
                <i data-lucide="user" class="input-icon"></i>
                <input type="text" name="name"
                       value="{{ profile[0] if profile else '' }}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <div class="input-wrapper">
                <i data-lucide="mail" class="input-icon"></i>
                <input type="email" name="email"
                       value="{{ profile[1] if profile else '' }}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Contact</label>
            <div class="input-wrapper">
                <i data-lucide="phone" class="input-icon"></i>
                <input type="text" name="contact"
                       value="{{ profile[2] if profile else '' }}" required>
            </div>
        </div>

        <button type="submit" class="btn-save">Save Profile</button>

    </form>

</div>

</div>

<style>

/* CENTER FIX INSIDE LAYOUT */
.page-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100%;
}

/* CARD */
.container{
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(24px);
    border-radius:24px;
    padding:40px;
    width:420px;
    text-align:center;
}

/* ICON */
.brand-icon{
    width:60px;
    height:60px;
    background:linear-gradient(135deg,#5CB8A5,#7DD3C0);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    color:white;
}

/* TEXT */
.brand-name{
    font-size:11px;
    letter-spacing:2px;
    color:#5CB8A5;
    margin-top:10px;
}

h2{
    font-family:'Outfit';
    margin-top:10px;
}

.subtitle{
    font-size:13px;
    color:#7a9e98;
    margin-bottom:20px;
}

/* FORM */
.form-group{
    text-align:left;
    margin-bottom:15px;
}

.form-group label{
    font-size:12px;
    color:#4a7c74;
}

.input-wrapper{
    position:relative;
}

.input-icon{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
}

input{
    width:100%;
    padding:10px 10px 10px 35px;
    border-radius:10px;
    border:1px solid #d4e8e3;
}

/* BUTTON */
.btn-save{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#5CB8A5,#7DD3C0);
    color:white;
    margin-top:10px;
}

</style>

{% endblock %}
