<!DOCTYPE html>
<html>
<head>
<title>Register — MedAI Predict</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    height: 100vh;
    overflow: hidden;
    background: #e8f4f0;
}

/* ── 3D CANVAS ── */
#bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}

/* ── OVERLAY ── */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    background:
        radial-gradient(ellipse at 25% 45%, rgba(125, 211, 192, 0.14) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 30%, rgba(168, 216, 234, 0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 85%, rgba(232, 165, 152, 0.07) 0%, transparent 40%);
    pointer-events: none;
}

/* ── FLOATING PARTICLES ── */
.float-particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    10% { opacity: 0.5; transform: translateY(-10vh) scale(1); }
    90% { opacity: 0.2; }
    100% { opacity: 0; transform: translateY(-100vh) scale(0.4); }
}

/* ── MAIN WRAPPER ── */
.page-wrapper {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 20px;
}

/* ── CARD ── */
.container {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    padding: 40px 36px 36px;
    border-radius: 24px;
    width: 420px;
    max-width: 95vw;
    text-align: center;
    box-shadow:
        0 8px 32px rgba(92, 184, 165, 0.10),
        0 2px 8px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes cardEntry {
    0% {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
        filter: blur(6px);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

/* ── BRAND ICON ── */
.brand-icon {
    width: 52px;
    height: 52px;
    border-radius: 15px;
    background: linear-gradient(135deg, #5CB8A5, #7DD3C0);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    box-shadow: 0 4px 16px rgba(92, 184, 165, 0.3);
    animation: iconPulse 3s ease-in-out infinite;
}

@keyframes iconPulse {
    0%, 100% { box-shadow: 0 4px 16px rgba(92, 184, 165, 0.3); }
    50% { box-shadow: 0 4px 28px rgba(92, 184, 165, 0.5); }
}

.brand-icon svg {
    color: white;
    width: 26px;
    height: 26px;
}

.brand-name {
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: #5CB8A5;
    margin-bottom: 6px;
}

h2 {
    font-family: 'Outfit', sans-serif;
    font-size: 24px;
    font-weight: 600;
    color: #1a3a35;
    margin-bottom: 4px;
}

.subtitle {
    font-size: 13.5px;
    color: #7a9e98;
    margin-bottom: 24px;
    font-weight: 400;
}

/* ── FORM ── */
.form-group {
    position: relative;
    margin-bottom: 14px;
    text-align: left;
}

.form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #4a7c74;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
}

.input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.input-wrapper .input-icon {
    position: absolute;
    left: 14px;
    color: #a3c4be;
    pointer-events: none;
    transition: color 0.3s;
    width: 18px;
    height: 18px;
}

.input-wrapper input {
    width: 100%;
    padding: 12px 14px 12px 42px;
    border-radius: 12px;
    border: 1.5px solid #d4e8e3;
    background: rgba(255, 255, 255, 0.7);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #1a3a35;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
}

.input-wrapper input::placeholder {
    color: #b0ccc6;
    font-weight: 400;
}

.input-wrapper input:hover {
    border-color: #a3d4c8;
    background: rgba(255, 255, 255, 0.9);
}

.input-wrapper input:focus {
    border-color: #5CB8A5;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 0 4px rgba(92, 184, 165, 0.1);
}

.input-wrapper:focus-within .input-icon {
    color: #5CB8A5;
}

/* ── PASSWORD TOGGLE ── */
.pw-toggle {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    cursor: pointer;
    color: #a3c4be;
    padding: 4px;
    transition: color 0.3s;
    display: flex;
    align-items: center;
}

.pw-toggle:hover {
    color: #5CB8A5;
}

.pw-toggle svg {
    width: 18px;
    height: 18px;
}

/* ── PASSWORD STRENGTH BAR ── */
.strength-bar-wrap {
    height: 4px;
    background: #e8f0ee;
    border-radius: 2px;
    margin-top: 6px;
    margin-bottom: 4px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s;
}

.strength-bar-wrap.visible {
    opacity: 1;
}

.strength-bar {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.4s;
}

.strength-label {
    font-size: 11px;
    text-align: left;
    color: #a3c4be;
    height: 16px;
    transition: color 0.3s;
    font-weight: 500;
}

/* ── REGISTER BUTTON ── */
.btn-register {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #5CB8A5, #4aA895);
    border: none;
    color: white;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    margin-top: 6px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(92, 184, 165, 0.25);
}

.btn-register::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
    transition: left 0.5s;
}

.btn-register:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(92, 184, 165, 0.35);
    background: linear-gradient(135deg, #4aA895, #3d9585);
}

.btn-register:hover::before {
    left: 100%;
}

.btn-register:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(92, 184, 165, 0.2);
}

/* ── HOME BUTTON ── */
.home-btn {
    width: 100%;
    padding: 12px;
    background: rgba(108, 130, 125, 0.08);
    border: 1.5px solid rgba(108, 130, 125, 0.12);
    color: #5a7d76;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.home-btn svg {
    width: 16px;
    height: 16px;
}

.home-btn:hover {
    background: rgba(108, 130, 125, 0.14);
    border-color: rgba(108, 130, 125, 0.2);
    color: #3d5c56;
    transform: translateY(-1px);
}

.home-btn:active {
    transform: translateY(0);
}

/* ── DIVIDER ── */
.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, #d4e8e3, transparent);
}

.divider span {
    font-size: 11px;
    color: #a3c4be;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
}

/* ── LINKS ── */
.links {
    margin-top: 8px;
    font-size: 13.5px;
    color: #7a9e98;
}

.links p {
    margin-bottom: 6px;
}

.links a {
    text-decoration: none;
    color: #4aA895;
    font-weight: 600;
    position: relative;
    transition: color 0.3s;
}

.links a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 1.5px;
    background: #5CB8A5;
    border-radius: 1px;
    transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.links a:hover {
    color: #3d8a7a;
}

.links a:hover::after {
    width: 100%;
}

/* ── LOADING SPINNER ── */
.btn-register .spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.btn-register.loading .btn-text { display: none; }
.btn-register.loading .spinner { display: block; }

/* ── TOAST ── */
.toast {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 100;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(92, 184, 165, 0.2);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    transform: translateX(120%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    font-size: 13px;
    color: #1a3a35;
}

.toast.show {
    transform: translateX(0);
}

.toast .toast-icon {
    width: 20px;
    height: 20px;
    color: #5CB8A5;
    flex-shrink: 0;
}

/* ── ERROR TOAST ── */
.toast.error {
    border-color: rgba(232, 165, 152, 0.3);
}

.toast.error .toast-icon {
    color: #E8A598;
}

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
    .container {
        padding: 32px 24px 28px;
        border-radius: 20px;
    }
    h2 { font-size: 22px; }
}

/* ── REDUCED MOTION ── */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>

</head>

<body>

<!-- 3D Background Canvas -->
<canvas id="bg-canvas"></canvas>

<!-- Overlay -->
<div class="overlay"></div>

<!-- Floating Particles -->
<div id="css-particles"></div>

<!-- Toast -->
<div class="toast" id="toast">
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
    <span id="toast-msg">Create your account to get started</span>
</div>

<!-- Main Page -->
<div class="page-wrapper">

<div class="container">

    <!-- Branding -->
    <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
    </div>
    <div class="brand-name">MedAI Predict</div>
    <h2>Create Account</h2>
    <p class="subtitle">Join the diagnostic platform</p>

    <!-- Register Form — WORKING PRESERVED -->
    <form method="post" id="registerForm">
        <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" name="username" id="username" placeholder="Choose a username" required autocomplete="username">
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" name="password" id="password" placeholder="Create a password" required autocomplete="new-password">
                <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">
                    <svg id="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    <svg id="eyeOn" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <!-- Password Strength -->
            <div class="strength-bar-wrap" id="strengthWrap">
                <div class="strength-bar" id="strengthBar"></div>
            </div>
            <div class="strength-label" id="strengthLabel"></div>
        </div>

        <button type="submit" class="btn-register" id="registerBtn">
            <span class="btn-text">Create Account</span>
            <div class="spinner"></div>
        </button>
    </form>

    <!-- Home Button — WORKING PRESERVED -->
    <button class="home-btn" onclick="location.href='/'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Home
    </button>

    <div class="divider"><span>or</span></div>

    <!-- Links — WORKING PRESERVED -->
    <div class="links">
        <p>Already have an account? <a href="/login">Sign In</a></p>
    </div>

</div>

</div>

<script>
// ── PASSWORD TOGGLE ──
const pwToggle = document.getElementById('pwToggle');
const pwInput = document.getElementById('password');
const eyeOff = document.getElementById('eyeOff');
const eyeOn = document.getElementById('eyeOn');

pwToggle.addEventListener('click', () => {
    const isPassword = pwInput.type === 'password';
    pwInput.type = isPassword ? 'text' : 'password';
    eyeOff.style.display = isPassword ? 'none' : 'block';
    eyeOn.style.display = isPassword ? 'block' : 'none';
});

// ── PASSWORD STRENGTH METER ──
const strengthWrap = document.getElementById('strengthWrap');
const strengthBar = document.getElementById('strengthBar');
const strengthLabel = document.getElementById('strengthLabel');

pwInput.addEventListener('input', () => {
    const val = pwInput.value;
    if (val.length === 0) {
        strengthWrap.classList.remove('visible');
        strengthLabel.textContent = '';
        return;
    }
    strengthWrap.classList.add('visible');

    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
        { width: '10%', color: '#E8A598', label: 'Very Weak' },
        { width: '25%', color: '#E8A598', label: 'Weak' },
        { width: '50%', color: '#E8C898', label: 'Fair' },
        { width: '75%', color: '#A8D8EA', label: 'Good' },
        { width: '90%', color: '#7DD3C0', label: 'Strong' },
        { width: '100%', color: '#5CB8A5', label: 'Very Strong' }
    ];

    const level = levels[Math.min(score, 5)];
    strengthBar.style.width = level.width;
    strengthBar.style.background = level.color;
    strengthLabel.textContent = level.label;
    strengthLabel.style.color = level.color;
});

// ── FORM SUBMIT ──
const registerForm = document.getElementById('registerForm');
const registerBtn = document.getElementById('registerBtn');

registerForm.addEventListener('submit', (e) => {
    // Validate minimum password length before submit
    if (pwInput.value.length < 6) {
        e.preventDefault();
        showToast('Password must be at least 6 characters', true);
        pwInput.focus();
        return;
    }
    registerBtn.classList.add('loading');
    registerBtn.disabled = true;
});

// ── TOAST HELPER ──
function showToast(msg, isError) {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');
    const toastIcon = toast.querySelector('.toast-icon');

    toastMsg.textContent = msg;

    if (isError) {
        toast.classList.add('error');
        toastIcon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';
    } else {
        toast.classList.remove('error');
        toastIcon.innerHTML = '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>';
    }

    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

// ── TOAST ON LOAD ──
window.addEventListener('load', () => {
    setTimeout(() => showToast('Create your account to get started', false), 1200);
});

// ── CSS FLOATING PARTICLES ──
(function createCSSParticles() {
    const container = document.getElementById('css-particles');
    const colors = [
        'rgba(92, 184, 165, 0.35)',
        'rgba(125, 211, 192, 0.3)',
        'rgba(168, 216, 234, 0.25)',
        'rgba(232, 165, 152, 0.2)',
        'rgba(180, 220, 210, 0.25)'
    ];
    for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.classList.add('float-particle');
        const size = Math.random() * 6 + 2;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = Math.random() * 100 + 'vw';
        p.style.bottom = '-10px';
        p.style.animationDuration = (Math.random() * 14 + 10) + 's';
        p.style.animationDelay = (Math.random() * 12) + 's';
        container.appendChild(p);
    }
})();

// ── THREE.JS 3D BACKGROUND ──
(function initThreeJS() {
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;

    const palette = [
        new THREE.Color(0x5CB8A5),
        new THREE.Color(0x7DD3C0),
        new THREE.Color(0xA8D8EA),
        new THREE.Color(0xE8A598),
        new THREE.Color(0xB4DCD2),
        new THREE.Color(0xD4E8E3),
    ];

    // ── MOLECULAR NODES ──
    const nodeCount = 42;
    const nodes = [];
    const nodeGroup = new THREE.Group();
    const sphereGeo = new THREE.SphereGeometry(0.22, 12, 12);

    for (let i = 0; i < nodeCount; i++) {
        const mat = new THREE.MeshBasicMaterial({
            color: palette[Math.floor(Math.random() * palette.length)],
            transparent: true,
            opacity: 0.4 + Math.random() * 0.3
        });
        const mesh = new THREE.Mesh(sphereGeo, mat);
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 7 + Math.random() * 20;
        mesh.position.set(
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi)
        );
        mesh.userData = {
            originalPos: mesh.position.clone(),
            speed: 0.2 + Math.random() * 0.4,
            offset: Math.random() * Math.PI * 2,
            amplitude: 0.4 + Math.random() * 1.2
        };
        nodeGroup.add(mesh);
        nodes.push(mesh);
    }
    scene.add(nodeGroup);

    // ── CONNECTION LINES ──
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0x5CB8A5, transparent: true, opacity: 0.05 });
    const lineGeometry = new THREE.BufferGeometry();
    const linePositions = [];

    function updateLines() {
        linePositions.length = 0;
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const dist = nodes[i].position.distanceTo(nodes[j].position);
                if (dist < 7) {
                    linePositions.push(
                        nodes[i].position.x, nodes[i].position.y, nodes[i].position.z,
                        nodes[j].position.x, nodes[j].position.y, nodes[j].position.z
                    );
                }
            }
        }
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
    }

    const linesMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(linesMesh);

    // ── DNA DOUBLE HELIX ──
    function createHelix(offset, color, radius) {
        const points = [];
        const helixHeight = 45;
        const turns = 3;
        for (let i = 0; i < 220; i++) {
            const t = i / 220;
            const angle = t * Math.PI * 2 * turns + offset;
            points.push(new THREE.Vector3(
                Math.cos(angle) * radius,
                (t - 0.5) * helixHeight,
                Math.sin(angle) * radius
            ));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.09 });
        return new THREE.Line(geo, mat);
    }

    const helix1 = createHelix(0, 0x5CB8A5, 3.5);
    const helix2 = createHelix(Math.PI, 0xA8D8EA, 3.5);
    helix1.position.set(15, 0, -6);
    helix2.position.set(15, 0, -6);
    helix1.rotation.z = -0.2;
    helix2.rotation.z = -0.2;
    scene.add(helix1, helix2);

    // ── HELIX RUNGS ──
    const rungGeo = new THREE.BufferGeometry();
    const rungPositions = [];
    for (let i = 0; i < 30; i++) {
        const t = i / 30;
        const angle = t * Math.PI * 2 * 3;
        const y = (t - 0.5) * 45;
        const r = 3.5;
        const x1 = Math.cos(angle) * r + 15;
        const z1 = Math.sin(angle) * r - 6;
        const x2 = Math.cos(angle + Math.PI) * r + 15;
        const z2 = Math.sin(angle + Math.PI) * r - 6;
        const rot = -0.2;
        rungPositions.push(
            x1 * Math.cos(rot) - y * Math.sin(rot), x1 * Math.sin(rot) + y * Math.cos(rot), z1,
            x2 * Math.cos(rot) - y * Math.sin(rot), x2 * Math.sin(rot) + y * Math.cos(rot), z2
        );
    }
    rungGeo.setAttribute('position', new THREE.Float32BufferAttribute(rungPositions, 3));
    scene.add(new THREE.LineSegments(rungGeo, new THREE.LineBasicMaterial({ color: 0xB4DCD2, transparent: true, opacity: 0.04 })));

    // ── FLOATING RINGS ──
    const ringGroup = new THREE.Group();
    const ringGeo = new THREE.TorusGeometry(0.3, 0.04, 8, 24);

    for (let i = 0; i < 14; i++) {
        const mat = new THREE.MeshBasicMaterial({
            color: palette[Math.floor(Math.random() * palette.length)],
            transparent: true,
            opacity: 0.15 + Math.random() * 0.15
        });
        const ring = new THREE.Mesh(ringGeo, mat);
        ring.position.set(
            (Math.random() - 0.5) * 55,
            (Math.random() - 0.5) * 35,
            (Math.random() - 0.5) * 25 - 5
        );
        ring.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        ring.scale.setScalar(0.4 + Math.random() * 1.6);
        ring.userData = {
            rotSpeed: { x: (Math.random() - 0.5) * 0.008, y: (Math.random() - 0.5) * 0.008 },
            floatSpeed: 0.15 + Math.random() * 0.25,
            floatOffset: Math.random() * Math.PI * 2
        };
        ringGroup.add(ring);
    }
    scene.add(ringGroup);

    // ── PULSE WAVES ──
    const pulseGroup = new THREE.Group();
    const pulseGeo = new THREE.RingGeometry(0.5, 0.55, 64);

    for (let i = 0; i < 3; i++) {
        const mat = new THREE.MeshBasicMaterial({
            color: 0x5CB8A5,
            transparent: true,
            opacity: 0.06,
            side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(pulseGeo, mat);
        ring.position.z = -14;
        ring.userData = { phase: i * 0.33 };
        pulseGroup.add(ring);
    }
    scene.add(pulseGroup);

    // ── MOUSE ──
    let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
    document.addEventListener('mousemove', (e) => {
        targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetMouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // ── ANIMATION ──
    let time = 0;

    function animate() {
        requestAnimationFrame(animate);
        time += 0.004;

        mouseX += (targetMouseX - mouseX) * 0.025;
        mouseY += (targetMouseY - mouseY) * 0.025;

        nodeGroup.rotation.y = mouseX * 0.12;
        nodeGroup.rotation.x = mouseY * 0.06;

        nodes.forEach(node => {
            const d = node.userData;
            node.position.x = d.originalPos.x + Math.sin(time * d.speed + d.offset) * d.amplitude;
            node.position.y = d.originalPos.y + Math.cos(time * d.speed * 0.7 + d.offset) * d.amplitude;
            node.position.z = d.originalPos.z + Math.sin(time * d.speed * 0.5 + d.offset + 1) * d.amplitude * 0.5;
        });

        updateLines();

        helix1.rotation.y = time * 0.25 + mouseX * 0.08;
        helix2.rotation.y = time * 0.25 + mouseX * 0.08;

        ringGroup.children.forEach(ring => {
            ring.rotation.x += ring.userData.rotSpeed.x;
            ring.rotation.y += ring.userData.rotSpeed.y;
            ring.position.y += Math.sin(time * ring.userData.floatSpeed + ring.userData.floatOffset) * 0.002;
        });

        pulseGroup.children.forEach(ring => {
            const phase = (time * 0.4 + ring.userData.phase) % 1;
            ring.scale.setScalar(1 + phase * 14);
            ring.material.opacity = 0.06 * (1 - phase);
        });

        camera.position.x += (mouseX * 1.8 - camera.position.x) * 0.015;
        camera.position.y += (-mouseY * 1.2 - camera.position.y) * 0.015;
        camera.lookAt(scene.position);

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
})();
</script>

</body>
