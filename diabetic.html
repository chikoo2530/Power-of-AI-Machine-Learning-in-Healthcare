<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction — MedAI Predict</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <style>
        /* ── GLOBAL VARIABLES & RESET ── */
        :root {
            --primary-teal: #5CB8A5;
            --secondary-mint: #7DD3C0;
            --bg-mint: #e8f4f0;
            --text-dark: #1a3a35;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-mint);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ── BACKGROUND LAYERS ── */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(125, 211, 192, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(168, 216, 234, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(232, 165, 152, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        /* ── FLOATING PARTICLES ── */
        .float-particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(0); }
            10% { opacity: 0.6; transform: translateY(-10vh) scale(1); }
            90% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(-100vh) scale(0.5); }
        }

        /* ── PAGE LAYOUT ── */
        .page-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 32px rgba(92, 184, 165, 0.15);
            animation: fadeIn 0.8s ease-out;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Custom Scrollbar for form */
        .container::-webkit-scrollbar {
            width: 6px;
        }
        .container::-webkit-scrollbar-thumb {
            background: var(--primary-teal);
            border-radius: 10px;
        }

        /* ── HEADER ── */
        .container h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(92,184,165,0.1);
            padding-bottom: 15px;
        }

        /* ── FORM GRID ── */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4a7c74;
        }

        /* ── INPUTS ── */
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.6);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            background: white;
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 3px rgba(92, 184, 165, 0.15);
        }

        /* ── BUTTON ── */
        .btn-predict {
            margin-top: 30px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-teal), var(--secondary-mint));
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(92, 184, 165, 0.3);
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(92, 184, 165, 0.4);
        }

        .btn-predict:active {
            transform: scale(0.98);
        }

        /* ── DASHBOARD BUTTON ── */
        .dashboard-btn {
            position: fixed;
            top: 20px;
            right: 30px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            color: #1a3a35;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .dashboard-btn:hover {
            background: linear-gradient(135deg, #5CB8A5, #7DD3C0);
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <a href="/dashboard" class="dashboard-btn">
        <i data-lucide="layout-dashboard"></i>
        Dashboard
    </a>

    <!-- 3D Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Gradient Overlay -->
    <div class="overlay"></div>

    <!-- CSS Particles Container -->
    <div id="css-particles"></div>

    <div class="page-wrapper">
        <div class="container">
            
            <h2>
                <i data-lucide="droplet" style="color: var(--primary-teal);"></i>
                Diabetes Prediction
            </h2>

            <form action="/predict" method="post">
                <input type="hidden" name="disease" value="diabetes">

                <div class="input-grid">
                    <div class="form-group">
                        <label>Pregnancies</label>
                        <input type="number" name="pregnancies" placeholder="0 - 17" required>
                    </div>

                    <div class="form-group">
                        <label>Glucose Level</label>
                        <input type="number" name="glucose" placeholder="mg/dL" required>
                    </div>

                    <div class="form-group">
                        <label>Blood Pressure</label>
                        <input type="number" name="bloodpressure" placeholder="mm Hg" required>
                    </div>

                    <div class="form-group">
                        <label>Skin Thickness</label>
                        <input type="number" name="skinthickness" placeholder="mm" required>
                    </div>

                    <div class="form-group">
                        <label>Insulin</label>
                        <input type="number" name="insulin" placeholder="mu U/ml" required>
                    </div>

                    <div class="form-group">
                        <label>BMI</label>
                        <input type="number" step="any" name="bmi" placeholder="kg/m²" required>
                    </div>

                    <div class="form-group">
                        <label>Diabetes Pedigree</label>
                        <input type="number" step="any" name="dpf" placeholder="Score" required>
                    </div>

                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" name="age" placeholder="Years" required>
                    </div>
                </div>

                <button type="submit" class="btn-predict">Analyze Prediction</button>

            </form>
        </div>
    </div>

    <!-- ── FLOATING CSS PARTICLES SCRIPT ── -->
    <script>
    (function createCSSParticles() {
        const container = document.getElementById('css-particles');
        const colors = [
            'rgba(92, 184, 165, 0.4)',
            'rgba(125, 211, 192, 0.35)',
            'rgba(180, 220, 210, 0.3)',
            'rgba(168, 216, 234, 0.3)'
        ];

        for (let i = 0; i < 15; i++) {
            const p = document.createElement('div');
            p.classList.add('float-particle');
            const size = Math.random() * 6 + 3;
            const color = colors[Math.floor(Math.random() * colors.length)];
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.background = color;
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '-10px';
            p.style.animationDuration = (Math.random() * 12 + 10) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            container.appendChild(p);
        }
    })();
    </script>

    <!-- ── COMPLEX THREE.JS BACKGROUND SCRIPT ── -->
    <script>
    (function initThreeJS() {
        const canvas = document.getElementById('bg-canvas');
        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 0);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const palette = [
            new THREE.Color(0x5CB8A5),
            new THREE.Color(0x7DD3C0),
            new THREE.Color(0xB4DCD2),
            new THREE.Color(0xA8D8EA),
            new THREE.Color(0xD4E8E3)
        ];

        // 1. NODES
        const nodeCount = 40;
        const nodes = [];
        const nodeGroup = new THREE.Group();
        const sphereGeo = new THREE.SphereGeometry(0.25, 16, 16);

        for (let i = 0; i < nodeCount; i++) {
            const mat = new THREE.MeshBasicMaterial({
                color: palette[Math.floor(Math.random() * palette.length)],
                transparent: true,
                opacity: 0.6
            });
            const mesh = new THREE.Mesh(sphereGeo, mat);
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 8 + Math.random() * 18;
            mesh.position.set(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );
            mesh.userData = {
                originalPos: mesh.position.clone(),
                speed: 0.3 + Math.random() * 0.5,
                offset: Math.random() * Math.PI * 2,
                amplitude: 0.5 + Math.random() * 1.5
            };
            nodeGroup.add(mesh);
            nodes.push(mesh);
        }
        scene.add(nodeGroup);

        // 2. CONNECTIONS
        const lineMaterial = new THREE.LineBasicMaterial({
            color: 0x5CB8A5,
            transparent: true,
            opacity: 0.08
        });
        const lineGeometry = new THREE.BufferGeometry();
        const linePositions = [];

        function updateLines() {
            linePositions.length = 0;
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dist = nodes[i].position.distanceTo(nodes[j].position);
                    if (dist < 8) {
                        linePositions.push(
                            nodes[i].position.x, nodes[i].position.y, nodes[i].position.z,
                            nodes[j].position.x, nodes[j].position.y, nodes[j].position.z
                        );
                    }
                }
            }
            lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        }
        const linesMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(linesMesh);

        // 3. HELIX
        function createHelix(offset, color, radius) {
            const points = [];
            const helixRadius = radius || 3.5;
            const helixHeight = 45;
            const turns = 3.5;
            for (let i = 0; i < 220; i++) {
                const t = i / 220;
                const angle = t * Math.PI * 2 * turns + offset;
                points.push(new THREE.Vector3(
                    Math.cos(angle) * helixRadius,
                    (t - 0.5) * helixHeight,
                    Math.sin(angle) * helixRadius
                ));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.15 });
            return new THREE.Line(geo, mat);
        }

        const helix1 = createHelix(0, 0x5CB8A5, 4);
        const helix2 = createHelix(Math.PI, 0xB4DCD2, 4);
        helix1.rotation.z = 0.2;
        helix2.rotation.z = 0.2;
        helix1.position.x = -15;
        helix2.position.x = -15;
        scene.add(helix1);
        scene.add(helix2);

        // 4. FLOATING RINGS
        const ringGroup = new THREE.Group();
        const ringGeo = new THREE.TorusGeometry(0.3, 0.05, 8, 24);
        for (let i = 0; i < 10; i++) {
            const mat = new THREE.MeshBasicMaterial({
                color: palette[Math.floor(Math.random() * palette.length)],
                transparent: true,
                opacity: 0.3
            });
            const ring = new THREE.Mesh(ringGeo, mat);
            ring.position.set(
                (Math.random() - 0.5) * 50,
                (Math.random() - 0.5) * 30,
                (Math.random() - 0.5) * 20 - 5
            );
            ring.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            ring.scale.setScalar(0.5 + Math.random());
            ring.userData = {
                rotSpeed: { x: (Math.random() - 0.5) * 0.01, y: (Math.random() - 0.5) * 0.01 },
                floatSpeed: 0.2 + Math.random() * 0.3,
                floatOffset: Math.random() * Math.PI * 2
            };
            ringGroup.add(ring);
        }
        scene.add(ringGroup);

        // MOUSE INTERACTION
        let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
        document.addEventListener('mousemove', (e) => {
            targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            targetMouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.005;

            mouseX += (targetMouseX - mouseX) * 0.03;
            mouseY += (targetMouseY - mouseY) * 0.03;

            nodeGroup.rotation.y = mouseX * 0.1;
            nodeGroup.rotation.x = mouseY * 0.05;

            nodes.forEach(node => {
                const d = node.userData;
                node.position.x = d.originalPos.x + Math.sin(time * d.speed + d.offset) * d.amplitude;
                node.position.y = d.originalPos.y + Math.cos(time * d.speed * 0.7 + d.offset) * d.amplitude;
                node.position.z = d.originalPos.z + Math.sin(time * d.speed * 0.5 + d.offset + 1) * d.amplitude * 0.5;
            });

            updateLines();

            helix1.rotation.y = time * 0.2 + mouseX * 0.1;
            helix2.rotation.y = time * 0.2 + mouseX * 0.1;

            ringGroup.children.forEach(ring => {
                ring.rotation.x += ring.userData.rotSpeed.x;
                ring.rotation.y += ring.userData.rotSpeed.y;
                ring.position.y += Math.sin(time * ring.userData.floatSpeed + ring.userData.floatOffset) * 0.003;
            });

            camera.position.x += (mouseX * 1.5 - camera.position.x) * 0.02;
            camera.position.y += (-mouseY * 1.5 - camera.position.y) * 0.02;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Init Icons
        lucide.createIcons();
    })();
    </script>

</body>
</html>
